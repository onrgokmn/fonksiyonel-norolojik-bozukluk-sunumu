<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Psikiyatride Hasta-Hekim İlişkisi</title><style>
:root{--ink:#162238;--blue:#1e4f79;--muted:#607286;--border:#dfe7ef;--pale:#edf4f9}*{box-sizing:border-box}body{margin:0;background:#e8edf2;color:var(--ink);font-family:Arial,Helvetica,sans-serif}button{font:inherit}.slide{position:absolute;inset:0;margin:auto;width:min(100vw,177.7778vh);height:min(100vh,56.25vw);background:white;display:none;overflow:hidden;box-shadow:0 4px 30px #17283b18}.slide.on{display:flex;flex-direction:column}.top{height:12%;border-bottom:2px solid var(--border);padding:2.2% 5.5% 1%;display:flex;align-items:end;justify-content:space-between}.tag{font-size:clamp(10px,1.05vw,19px);letter-spacing:2px;font-weight:bold;color:var(--blue)}.top small{color:var(--muted);font-size:clamp(10px,1vw,17px)}.main{flex:1;padding:4% 6% 2%;display:flex;flex-direction:column;justify-content:center}.main h1{font-size:clamp(25px,3.2vw,58px);line-height:1.18;letter-spacing:-.7px;margin:0 0 3.2%;color:#123958}.points{margin:0;padding:0;list-style:none;display:grid;gap:1.5vw}.points li{font-size:clamp(16px,2.02vw,36px);line-height:1.36;padding-left:2.1vw;position:relative}.points li:before{content:'';position:absolute;left:0;top:.55em;width:.67vw;height:.67vw;min-width:7px;min-height:7px;border-radius:50%;background:#39719c}.footer{height:9%;display:flex;align-items:center;justify-content:space-between;padding:0 5.5%;border-top:1px solid var(--border);color:var(--muted);font-size:clamp(9px,.86vw,16px)}.footer .source{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:85%}.count{font-weight:bold;color:var(--blue)}.controls{position:fixed;right:14px;bottom:14px;display:flex;gap:8px;z-index:15}.controls button{background:#183c5e;color:white;border:0;border-radius:7px;padding:10px 13px;cursor:pointer}.controls button:hover{background:#2d638c}.toc{display:none;position:fixed;z-index:20;inset:2%;background:#fff;overflow:auto;padding:30px;box-shadow:0 0 0 100vh #17283bc9;border-radius:10px}.toc.show{display:block}.toc button{display:block;width:100%;border:0;border-bottom:1px solid #ddd;padding:12px;text-align:left;background:white;cursor:pointer;color:#164363}.toc h2{margin-top:0}.hint{position:fixed;left:15px;bottom:16px;color:#476179;font-size:12px;z-index:10}@media(max-width:700px){.controls{right:8px;bottom:8px}.controls button{padding:8px}.hint{display:none}.points{gap:1vw}.main h1{margin-bottom:2.4%}}@media print{body{background:white}.slide{position:relative;display:flex!important;break-after:page;box-shadow:none;width:100vw;height:56.25vw}.controls,.hint,.toc{display:none!important}} </style></head><body><main id="deck"></main><div class="hint">← → gezinme · L: liste · F: tam ekran</div><nav class="controls"><button id="prev" aria-label="Önceki">◀</button><button id="index" aria-label="İçindekiler">☰</button><button id="next" aria-label="Sonraki">▶</button><button id="full" aria-label="Tam ekran">⛶</button></nav><div class="toc" id="toc"><h2>Slaytlar <button style="float:right;width:auto" id="close">Kapat ✕</button></h2><div id="tocitems"></div></div><script>const SLIDES=[{"sec": "GİRİŞ", "title": "Psikiyatride hasta–hekim ilişkisi", "points": ["Terapötik ilişkinin kurulması, sürdürülmesi ve onarılması", "Psikiyatri asistan eğitimi | Klinik uygulama ve olgular", "Tanısal görüşmeden etik sınırlara kadar bütüncül yaklaşım"], "notes": "Ana mesaj: psikiyatride ilişki yalnızca bilgi toplamanın aracı değildir; değerlendirme, güvenlik, tedaviye katılım ve değişimin gerçekleştiği zemindir. Sunum 45–60 dakikalık asistan semineri için tasarlanmıştır.", "src": "Kaplan & Sadock, Synopsis of Psychiatry; NICE CG136"}, {"sec": "GİRİŞ", "title": "Öğrenim hedefleri", "points": ["Terapötik ittifakın bileşenlerini tanımlamak", "Empati, doğrulama ve klinik sınır koymayı uygulamak", "Aktarım, karşıaktarım ve ilişki kopmalarını fark etmek", "Zor görüşmelerde güvenliği, özerkliği ve etik ilkeyi korumak"], "notes": "Katılımcılardan yakın zamanda güçlandıkları bir klinik görüşmeyi düşünmelerini isteyin. Bu olayda hastanın davranışından önce ilişkide ne yaşandığına bakacağız.", "src": "Kaplan & Sadock; NICE CG136"}, {"sec": "TEMELLER", "title": "Neden psikiyatride daha merkezî?", "points": ["Öykü ve ruhsal durum muayenesi büyük ölçüde görüşmeye dayanır", "Utanç, damgalanma, kuşkuculuk ve travma açıklığı etkiler", "İlaç tercihi, güven, izlem ve terapötik süreklilik ilişkiyle bağlantılıdır", "Belirtiler ilişkinin kendisini etkileyebilir: paranoid yorum, kaçınma, bağımlılık"], "notes": "Örneğin psikotik belirtileri olan bir hasta, hekimi tehdit olarak yorumlayabilir. Hekimin konuşma biçimi hem bilgi elde etmeyi hem güvenli değerlendirmeyi etkiler. Bununla birlikte iyi ilişki tanısal titizliğin yerine geçmez.", "src": "Kaplan & Sadock; NICE CG136"}, {"sec": "TEMELLER", "title": "Terapötik ittifak: üç bileşen", "points": ["**Hedef**: Ne için birlikte çalışıyoruz?", "**Görev**: Hangi yöntemleri kabul ediyoruz?", "**Bağ**: Güven, saygı ve işbirliği", "Hasta ile hekimin hedefleri farklı olabilir; farkı görünür kılmak gerekir"], "notes": "Bordin modelini anlatın. Örnek: hekim antipsikotik başlanmasını isterken hasta sadece uykusunun düzelmesini isteyebilir. İlk adım anlaşmazlığı yok saymak değil ortak amaç belirlemektir.", "src": "Bordin, 1979; NICE CG136"}, {"sec": "TEMELLER", "title": "İttifak ile tedavi sonucu arasındaki ilişki", "points": ["Psikoterapi çalışmalarında ittifak ile sonuç arasında tutarlı pozitif ilişki vardır", "Korelasyon nedensellik kanıtı değildir", "İttifak hem müdahale öncesinde hem süreç içinde değerlendirilmelidir", "Farmakoterapide de güven, ortak karar ve izlem açısından klinik önemi vardır"], "notes": "Flückiger ve arkadaşlarının meta-analizleri, farklı psikoterapi biçimlerinde ilişki ile sonuç arasında orta düzeyde bir ilişki bulur. Bir ölçek puanını tek başına tedavinin başarı ölçütü saymayın.", "src": "Flückiger et al., Psychotherapy, 2018; NICE CG136"}, {"sec": "TEMELLER", "title": "Terapötik ilişki ≠ arkadaşlık", "points": ["Profesyonel amaç ve rol asimetrisi vardır", "Sıcaklık + öngörülebilirlik + dürüstlük + sınır", "Aşırı mesafe güvensizlik, aşırı yakınlık rol karmaşası yaratabilir", "Klinik şefkat, kurtarıcı rolü üstlenmek anlamına gelmez"], "notes": "Hekim hastayı yargılamadan destekleyebilir; buna karşın karşılıklı özel yaşam paylaşımı, sosyal medya teması ve özel iyilikler ilişkiyi karmaşıklaştırabilir. Sınır ihlali ile esnek fakat gerekçeli sınır geçişini ayırın.", "src": "Kaplan & Sadock; NICE CG136"}, {"sec": "İLK GÖRÜŞME", "title": "İlk 90 saniye: ilişkiyi kurmak", "points": ["Kendini ve rolünü tanıt; görüşme süresini açıkla", "Mahremiyetin kapsamı ve istisnalarını anlaşılır biçimde söyle", "Açık uçlu soruyla başla: “Bugün sizi buraya getiren nedir?”", "Söz kesmeden dinle; gündemi birlikte belirle"], "notes": "Örnek başlangıç: “Ben psikiyatri asistanı hekimim. Yaklaşık 25 dakikamız var. Önce sizi dinleyeceğim, sonra birlikte bir plan oluşturacağız.” Görüşmeye refakatçi eşlik ediyorsa hastanın tek başına konuşabilmesi için zaman ayırın.", "src": "NICE CG136 §1.3; NICE NG197"}, {"sec": "İLK GÖRÜŞME", "title": "Dinleme mikrobecerileri", "points": ["Açık uçlu soru → odaklanmış soru → özet", "Yansıtma: “Bunun sizi oldukça korkuttuğunu anlıyorum.”", "Sessizlik: yanıtı hastadan aceleyle çekip alma", "Sözsüz iletişim: dikkat, duruş, uygun göz teması, not alma dengesi"], "notes": "Hastanın sözcüklerini kullanmak çoğu zaman jargon kullanmaktan daha etkilidir. Yansıtma hastaya katılmak değildir. Sessizliği klinik bağlam ve kültürel özelliklere göre kullanın.", "src": "Kaplan & Sadock; NICE CG136"}, {"sec": "İLK GÖRÜŞME", "title": "Empati, sempati ve doğrulama", "points": ["**Empati**: yaşantıyı hastanın perspektifinden anlamaya çalışma", "**Sempati**: hastaya üzülme veya onunla duygudaşlık kurma", "**Doğrulama**: duygunun bağlamda anlaşılabilir olduğunu belirtme", "**Onaylama değil**: sanrıyı, riskli davranışı veya yanlış bilgiyi gerçek kabul etme"], "notes": "Örnek: “İzlendiğinizi hissetmek çok korkutucu olabilir” demek deneyimi doğrular; “Evet, sizi izliyorlar” demek sanrısal içeriği pekiştirir. Klinik empati nesnelliği korur.", "src": "Kaplan & Sadock; NICE CG136"}, {"sec": "İLK GÖRÜŞME", "title": "Sorulması gereken iki soru", "points": ["“Sizin için en zor olan kısmı ne?”", "“Bu görüşmeden ne olmasını umuyorsunuz?”", "Belirti kadar işlevsellik, bağlam ve kişisel anlamı araştır", "Hastanın anlatısına biyopsikososyal formülasyonla dön"], "notes": "Hasta “çok kötüyüm” dediğinde depresif belirtiler kadar iş kaybı, ilişkiler ve önceki sağlık deneyimlerini öğrenin. Hastanın gündemi tanısal görüşmeden bağımsız değildir.", "src": "Kaplan & Sadock; NICE CG136"}, {"sec": "İLETİŞİM", "title": "Doğrulayıcı ve doğrulamayan dil", "points": ["Yararlı: “Bunun size çok gerçek geldiğini görüyorum.”", "Yararlı: “Katılmadığımız noktayı da açıkça konuşabiliriz.”", "Kaçınılacak: “Bunları kafanızda kuruyorsunuz.”", "Kaçınılacak: “Sizi tamamen anlıyorum.”"], "notes": "İkinci örnek özellikle travmatik öyküde hastanın tecrübesini sahiplenme izlenimi verebilir. Daha ölçülü olan “Söylediklerinizden bunun ne kadar zor olduğunu anlıyorum” ifadesidir.", "src": "Kaplan & Sadock; NICE CG136"}, {"sec": "İLETİŞİM", "title": "Kötü haber ve tanı konuşması", "points": ["Önce hastanın bildiğini ve öğrenmek istediğini sor", "Tanıyı etiket yerine klinik bulgular ve belirsizliklerle açıkla", "Bilgiyi küçük parçalarla ver, anlamayı kontrol et", "Duygu tepkisine alan aç, sonraki adımı birlikte belirle"], "notes": "“Şizofreni” tanısını söylemek gerektiğinde bunu bir kimlik etiketi gibi kullanmayın. “Şu belirtileri birlikte değerlendirdiğimizde bu tanı üzerinde duruyoruz; tedavi seçenekleri var” biçiminde açıklayın. Gerektiğinde tanısal belirsizliği koruyun.", "src": "NICE NG197"}, {"sec": "İLETİŞİM", "title": "Ortak karar verme: üç konuşma", "points": ["**Seçim**: Birden fazla makul yol olduğunu belirt", "**Seçenek**: Etkinlik, yan etki, maliyet ve izlem farklarını anlat", "**Karar**: Hastanın değerleriyle uyumlu plan oluştur", "Karar ve yeniden değerlendirme zamanını dosyada kaydet"], "notes": "Antidepresan başlanırken hastanın cinsel yan etki, sedasyon ya da kilo artışıyla ilgili öncelikleri sorulmalıdır. Akut tehlike ve kapasite sorunları karar sürecini değiştirebilir, ama gereksiz paternalizmi haklı kılmaz.", "src": "NICE NG197"}, {"sec": "İLETİŞİM", "title": "Teach-back: anlaşıldı mı?", "points": ["“Anladınız mı?” sorusu tek başına yetersizdir", "“Ben doğru anlatabildim mi, ilacı nasıl kullanacağınızı kendi sözlerinizle anlatır mısınız?”", "Gerekirse daha sade ifadeyle yeniden açıkla", "Kontrolü hastaya sınav gibi hissettirme"], "notes": "Özellikle çoklu ilaç, doz titrasyonu ve acil başvuru belirtilerinde kullanın. Hastanın yeniden anlatamaması onun yetersizliğinden çok anlatımın gözden geçirilmesi gerektiğini gösterebilir.", "src": "NICE NG197 §1.2"}, {"sec": "PSİKODİNAMİK", "title": "Aktarım (transference)", "points": ["Geçmiş önemli ilişki örüntülerinin hekimle ilişkide yeniden yaşanması", "Olumlu: idealleştirme, yoğun güven, kurtarılma beklentisi", "Olumsuz: kuşku, reddedilme beklentisi, otoriteye öfke", "Her tepki aktarım değildir: gerçek ilişki koşullarını da değerlendir"], "notes": "Örnek: hekim 10 dakika geciktiğinde hasta bunu “Beni de terk ettiniz” şeklinde yorumlayabilir. Önce gecikmenin gerçek etkisini kabul edin, ardından tekrarlayan örüntüyü keşfedin. Hasta davranışını otomatik olarak aktarım saymak klinik hatadır.", "src": "Gabbard, Psychodynamic Psychiatry; Kaplan & Sadock"}, {"sec": "PSİKODİNAMİK", "title": "Karşıaktarım (countertransference)", "points": ["Hekimin hastaya yönelik duygusal, bedensel ve bilişsel tepkileri", "Kızgınlık, aşırı koruma isteği, sıkılma, çaresizlik, kurtarma dürtüsü", "Yargı değil veri: fark et, düzenle, süpervizyonda düşün", "Eyleme dökülürse sınır ve klinik karar sorunları doğurabilir"], "notes": "Görüşmede “Bu hastadan kaçınmak istiyorum” tepkisi oluşursa yorgunluk, geçmiş deneyimler ve hastanın ilişki örüntüsü birlikte incelenmelidir. Karşıaktarım tanısal kestirme yol değildir.", "src": "Gabbard; Kaplan & Sadock"}, {"sec": "PSİKODİNAMİK", "title": "Aktarım ve karşıaktarım: klinik örnek", "points": ["Hasta: “Siz de diğer doktorlar gibi beni bırakacaksınız.”", "Hekimin iç tepkisi: savunmaya geçme veya sınırsız güvence verme isteği", "Yararlı yanıt: “Böyle bir endişe taşıdığınızı duyuyorum. Önceki deneyimlerde ne olmuştu?”", "Süreklilik, erişilebilirlik ve görüşme sınırları açıkça konuşulur"], "notes": "Hekimin “Asla sizi bırakmam” demesi gerçekçi olmayan bir vaattir. “Takip planımızı birlikte yapabiliriz, değişiklik olursa sizi bilgilendireceğiz” daha güvenli ve öngörülebilirdir.", "src": "Kaplan & Sadock; NICE CG136"}, {"sec": "PSİKODİNAMİK", "title": "Savunma düzenekleri ile çalışma", "points": ["İnkâr, yansıtma, bölme, entelektüelleştirme, değersizleştirme", "Savunmayı utandırmadan işlevi ve bedeli üzerinden ele al", "Akut kriz sırasında yüzleştirme düzeyi sınırlı tutulur", "Yorumlama için güven, zamanlama ve ego kapasitesi önemlidir"], "notes": "Hasta “Herkes bana kötü davranıyor” dediğinde doğrudan “Bu projeksiyon” demek yerine, “Bu deneyim sizde ne hissettirdi, benzer durumlar oluyor mu?” diye sorun. Savunmaların bir işlevi olduğunu hatırlayın.", "src": "Gabbard; Kaplan & Sadock"}, {"sec": "SINIRLAR", "title": "Terapötik çerçeve ve sınırlar", "points": ["Görüşme süresi, sıklığı, iletişim kanalı ve ulaşılabilirlik", "Hediye, sosyal medya, hastayla kişisel ilişki ve öz-açıklama", "Fiziksel temas ve mahremiyet özel dikkat gerektirir", "İstisnalar gerekçeli, asgari düzeyde ve belgelenmiş olmalı"], "notes": "Hastanın sosyal medyada takip isteğini kabul etmeme gerekçesini yargılamadan açıklayın. Hediye için kurum politikası, değer, bağlam ve güç asimetrisini göz önüne alın. Cinsel/romantik ilişki etik açıdan kesinlikle kabul edilemez.", "src": "WPA Madrid Declaration; mesleki etik ilkeler"}, {"sec": "SINIRLAR", "title": "Hekimin kendini açması: ne zaman?", "points": ["Hasta yararına açık bir klinik amaç taşımalı", "Kısa, sınırlı, uygun ve tedavinin odağını değiştirmemeli", "Hastanın hekimi teselli etmesini gerektirmemeli", "Paylaşmadan önce “Bu kimin ihtiyacını karşılıyor?” diye sor"], "notes": "Örnek: hasta “Siz de hiç kaygı yaşadınız mı?” dediğinde kişisel yaşam öyküsüne geçmek yerine, “Bu soruyu sormanıza ne yol açtı?” diye araştırın. Uygun ise kısa genel bir yanıt verilebilir.", "src": "Gabbard; mesleki etik ilkeler"}, {"sec": "ZOR GÖRÜŞMELER", "title": "İttifak kopması (rupture) nasıl anlaşılır?", "points": ["Geri çekilme: sessizlik, onaylayıp uzaklaşma, randevu kaçırma", "Karşı çıkma: öfke, meydan okuma, “Beni dinlemiyorsunuz”", "İlişkiyi onarmak tartışmayı kazanmak değildir", "Kopmayı adlandır → payını üstlen → hedefleri yeniden müzakere et"], "notes": "“İlaçları anlatırken sizi yeterince dinlemediğimi düşünüyor olabilirsiniz. Bunu konuşmak isterim.” Hastanın farklı perspektifini kabul etmek profesyonel otorite kaybı değildir.", "src": "Safran & Muran, Negotiating the Therapeutic Alliance"}, {"sec": "ZOR GÖRÜŞMELER", "title": "Öfkeli/ajite hasta: ilk yaklaşım", "points": ["Önce güvenlik, ortam ve yardım çağırma gereksinimi", "Sakin ses, açık beden duruşu, güvenli mesafe", "Tek bir kişinin iletişimi yönetmesi, somut seçenek sunulması", "Tehdit, küçümseme, güç mücadelesi ve ani temaslardan kaçınma"], "notes": "Ajitasyonu yalnızca psikiyatrik kabul etmeyin; deliryum, intoksikasyon, hipoglisemi ve diğer tıbbi nedenleri değerlendirin. De-eskalasyon başarısız olur ve yakın zarar riski doğarsa kurum protokollerine göre en az kısıtlayıcı müdahaleyi seçin.", "src": "NICE NG10"}, {"sec": "ZOR GÖRÜŞMELER", "title": "Paranoid ve psikotik yaşantılar", "points": ["Sanrısal içeriği onaylama veya tartışarak çürütmeye çalışma", "Duyguyu ve güvenlik gereksinimini doğrula", "Açıklamaları somut, kısa ve şeffaf tut", "Gerçeklik değerlendirmesi ve risk incelemesini sürdür"], "notes": "“Seslerin size çok korkutucu geldiğini anlıyorum; ben şu an aynı sesi duymuyorum. Sizi güvende tutacak seçenekleri konuşalım.” İşitsel varsanının içeriğini, komut niteliğini ve eyleme geçme riskini ayrıca değerlendirin.", "src": "NICE CG136; Kaplan & Sadock"}, {"sec": "ZOR GÖRÜŞMELER", "title": "Manik hastada görüşme", "points": ["Kısa, somut ve tek konuya odaklanan sorular", "Uyaranı azalt, zaman ve davranış sınırlarını açık koy", "Taşkınlığa karşı meydan okuma yerine yapılandırma", "Karar verme kapasitesi ve riskleri ayrıca değerlendir"], "notes": "“Sizi dinlemek istiyorum; aynı anda birçok konuya geçiyoruz. Önce uykunuzu sonra tedavi planını konuşalım.” Sadece iyi ilişkiyle dürtüsellik ve içgörü sorunlarını çözmeyi beklemeyin.", "src": "Kaplan & Sadock; NICE CG136"}, {"sec": "ZOR GÖRÜŞMELER", "title": "Kişilik örüntüleri ve yoğun duygular", "points": ["İlişkiyi idealleştirme/değersizleştirme döngüleri görülebilir", "Tutarlı ekip mesajları ve sınırlar kritik", "Duyguyu doğrula, davranışa uygun sınır koy", "“Manipülatif” gibi damgalayıcı ifadeler yerine gözlenen davranışı yaz"], "notes": "“Şu anda kendinizi terk edilmiş hissediyor olabilirsiniz. Görüşmemizin saatini koruyacağım ve krizde başvuracağınız yolu netleştireceğiz.” Hastanın ihtiyacını küçümsemeden sınır koymayı gösterin.", "src": "NICE CG136; klinik psikoterapi literatürü"}, {"sec": "ZOR GÖRÜŞMELER", "title": "İlaç istemeyen veya tedaviyi bırakan hasta", "points": ["Önce gerekçeyi sor: yan etki, maliyet, inanç, önceki deneyim", "Uyumu ahlaki özellik değil dinamik davranış olarak değerlendir", "Risk–yarar, alternatifler ve tedavisizlik seçeneği anlatılır", "Kapasite ve acil risk durumlarını ayrıca ele al"], "notes": "“İlacı bırakmanıza ne yol açtı?” sorusu “Neden sözümü dinlemediniz?” sorusundan daha fazla veri üretir. Ortak karar verme her isteğe onay verme değildir.", "src": "NICE NG197"}, {"sec": "ZOR GÖRÜŞMELER", "title": "İntihar düşüncesini konuşmak", "points": ["Doğrudan, sakin ve yargısız sorular kullan", "Düşünce, niyet, plan, erişim, geçmiş girişim ve koruyucular", "Tek bir risk puanı bireysel geleceği öngörmez", "Güvenlik planı, yakın izlem ve uygun bakım düzeyini belirle"], "notes": "Örnek: “Son günlerde yaşamınıza son vermeyi düşündünüz mü? Bunu gerçekleştirmek için planınız var mı?” Gizlilik sınırları ve gerekli destek kişilerinin katılımı açıkça açıklanmalıdır. Güvenlik sözleşmesi tek başına risk yönetimi yerine geçmez.", "src": "NICE NG225 self-harm; NICE CG136"}, {"sec": "ETİK / HUKUK", "title": "Mahremiyet ve gizliliğin sınırları", "points": ["Hastanın özel yaşamı ve sağlık verileri korunur", "Görüşmenin başında bilginin kimlerle paylaşılabileceği açıklanır", "Yasal bildirim, ciddi ve yakın güvenlik riski gibi istisnalar bağlama özgüdür", "Yalnızca gerekli bilgiyi, uygun yetkiyle, belgeli biçimde paylaş"], "notes": "Türkiye’de ilgili Hasta Hakları Yönetmeliği, KVKK ve diğer güncel mevzuatla kurumsal protokoller birlikte ele alınır. İstisnaları her durumda otomatik ve sınırsız paylaşım gibi sunmayın.", "src": "Türkiye Hasta Hakları Yönetmeliği; KVKK; NICE CG136"}, {"sec": "ETİK / HUKUK", "title": "Aydınlatılmış onam ve karar verme kapasitesi", "points": ["Bilgi verme → anlama → değerlendirme → tercih bildirme", "Kapasite tanıya göre değil, karar ve zamana göre değerlendirilir", "Kapasite kaybı varsayımı yerine destekleyici karar yöntemleri", "Acil müdahale ve istem dışı uygulamalar için özgül hukuki dayanak gerekir"], "notes": "Bir psikotik bozukluk tanısı tek başına tüm kararlarda kapasite kaybı anlamına gelmez. Hastanın seçeneği değerlendirebilmesi, sonuçları tartabilmesi ve istikrarlı bir tercih sunabilmesi incelenir. Türkiye’de hukuki kararlar için güncel mevzuat ve kurum hukuki danışmanlığı esas alınmalıdır.", "src": "NICE NG108; Türkiye Hasta Hakları Yönetmeliği"}, {"sec": "ETİK / HUKUK", "title": "Aile ve yakınlarla çalışma", "points": ["Hasta izni, gizlilik ve bağımsız görüşme hakkı", "Yakınlardan bilgi alma ile hastaya bilgi açıklama farklıdır", "Aile çatışmalarında taraf tutmama", "Aileyi tedavi planına uygun düzeyde katma"], "notes": "Hasta aileden destek isteyebilir ancak erişkin hastanın tanısını otomatik olarak ailesine açıklamak uygun değildir. Önce izin isteyin ve paylaşılacak kapsamı konuşun. Acil güvenlik ve hukuki istisnalar ayrı değerlendirilir.", "src": "NICE CG136; Türkiye Hasta Hakları Yönetmeliği"}, {"sec": "ETİK / HUKUK", "title": "Travma bilgili klinik ilişki", "points": ["Güvenlik ve öngörülebilirlik", "Seçim, işbirliği ve güçlendirme", "Tekrarlayan travmatik anlatımı gereksiz yere zorlamama", "Muayene, soru ve müdahalelerin amacını önceden açıklama"], "notes": "Travma öyküsü olan hastaya ayrıntılı olayı ilk görüşmede anlatma baskısı kurmayın. Kontrol duygusu önemli bir terapötik araçtır. Kişinin kültürel ve sosyal bağlamı da ele alınmalıdır.", "src": "SAMHSA, Trauma-Informed Care; NICE CG136"}, {"sec": "KLİNİK UYGULAMA", "title": "Poliklinikte 15–20 dakikalık ilişki odaklı görüşme", "points": ["0–2 dk: güven ve ortak gündem", "2–10 dk: anlatı, belirtiler, işlevsellik ve risk", "10–15 dk: formülasyon ve seçenekler", "15–20 dk: ortak plan, teach-back, takip ve güvenlik ağı"], "notes": "Bu süreler pratik bir eğitim şablonudur; klinik kılavuzun zorunlu standardı değildir. Yüksek riskli ya da karmaşık hastada süre ve bakım organizasyonu genişletilmelidir.", "src": "Pratik eğitim çerçevesi; NICE NG197"}, {"sec": "KLİNİK UYGULAMA", "title": "Konsültasyon psikiyatrisinde ittifak", "points": ["Hasta çoğu zaman görüşmeyi kendisi istememiş olabilir", "“Sizi değerlendirmem istendi; sizin bakış açınızı da duymak istiyorum.”", "Tıbbi ekip ve psikiyatri arasındaki bilgi paylaşımını açıkla", "Somatik yakınmayı psikolojik diye peşinen etiketleme"], "notes": "“Tetkikleriniz normal, sorun psikolojik” biçimindeki bir açılış ittifakı zedeleyebilir. Değerlendirme isteğinin kaynağına ve hastanın kaygısına açıklık getirin. Hasta ve ekibin hedefleri çelişebilir.", "src": "Kaplan & Sadock; NICE CG136"}, {"sec": "KLİNİK UYGULAMA", "title": "İlişkiyi belgeleme: objektif not", "points": ["Gözlenen davranış: “Ses tonunu yükseltti, kapıya yöneldi”", "Hastanın öznel ifadesi: kısa, yerinde doğrudan alıntı", "Risk ve kapasite değerlendirmesinin gerekçesi", "Ortak plan, hastanın tercihi, reddi ve izlem düzeni"], "notes": "“Hasta manipülatif” yerine “Görüşme süresi uzatılmayınca ses tonunu yükseltti; kendine zarar verme düşüncesi ifade etti, risk yeniden değerlendirildi” gibi kayıt somut ve klinik olarak yararlıdır.", "src": "NICE NG197 §1.2.17; klinik kayıt ilkeleri"}, {"sec": "OLGU TARTIŞMALARI", "title": "Olgu 1: “Siz de beni önemsemiyorsunuz”", "points": ["32 yaş, depresif belirtiler, üçüncü başvuru", "Hekim 20 dk gecikiyor; hasta sert konuşup çıkmak istiyor", "Soru: gerçek aksaklık, aktarım ve ittifak kopması nasıl ayırt edilir?", "Müdahale: gecikmeyi kabul et, duyguyu yansıt, hedefi yeniden kur"], "notes": "Örnek yanıt: “Bekletildiğiniz için özür dilerim. Bunun sizi önemsenmediğiniz duygusuna götürdüğünü fark ediyorum. Öncelikle bugün sizin için en önemli konuyu konuşalım.” Rol canlandırmada savunmacı yanıtla kıyaslayın.", "src": "Safran & Muran; NICE CG136"}, {"sec": "OLGU TARTIŞMALARI", "title": "Olgu 2: sanrısal kuşku ve tedavi reddi", "points": ["24 yaş, ilk epizod psikoz; “İlaçlar beni kontrol edecek.”", "Tartışmak mı, duyguyu doğrulamak mı?", "İttifak için ortak hedef: korkunun ve uykusuzluğun azalması", "Risk, kapasite ve tedavi seçenekleri ayrı değerlendirilir"], "notes": "Örnek yanıt: “Kontrolünüzü kaybetmekten endişe ettiğinizi anlıyorum. İlacın ne yapacağını ve hangi yan etkileri olabileceğini açıkça konuşalım. Karar verme sürecinde sizin görüşünüz önemli.” Acil risk varsa farklı bakım yolu gerekebilir.", "src": "NICE CG136; NICE NG197"}, {"sec": "OLGU TARTIŞMALARI", "title": "Olgu 3: sınır ve karşıaktarım", "points": ["26 yaş, yoğun terk edilme korkusu", "Hekimin kişisel telefonunu istiyor; ulaşamazsa kendine zarar vereceğini söylüyor", "Hekimde suçluluk ve kurtarma isteği oluşuyor", "Plan: anlık risk değerlendirmesi + ekip temelli kriz planı + net iletişim sınırları"], "notes": "Önce ifade edilen kendine zarar riskini acil olarak değerlendirin. Sadece sınır ihlali gibi görmeyin. Kişisel numara paylaşmak yerine resmi başvuru kanalları ve izlem düzeni sunun; karşıaktarım için süpervizyon alın.", "src": "NICE NG225; mesleki etik ilkeler"}, {"sec": "OLGU TARTIŞMALARI", "title": "Rol oynama: 3 dakikalık uygulama", "points": ["Hekim, hasta ve gözlemci rollerini dağıt", "Hekim: gündemi kur, duyguyu doğrula, ortak karar oluştur", "Gözlemci: söz kesme, yargılama, açık soru ve sınırları izle", "Geri bildirim: önce etkili davranış, sonra tek gelişim hedefi"], "notes": "Katılımcıların 90 saniye görüşme ve 90 saniye geri bildirim yapmasını sağlayın. Sadece teorik yanıt değil kullanılabilir cümle üretmelerini isteyin.", "src": "NICE NG197: uygulamalı eğitim"}, {"sec": "DEĞERLENDİRME", "title": "Asistan için görüşme kontrol listesi", "points": ["Hasta kendini ifade edebildi mi?", "Duygusu yansıtıldı, kuşkular ve beklentiler soruldu mu?", "Risk, mahremiyet, onam ve sınırlar ele alındı mı?", "Karar, anlayış kontrolü ve takip planı birlikte oluşturuldu mu?"], "notes": "Bu kontrol listesi geçerlenmiş bir ölçek değildir, eğitim amaçlıdır. Önemli bir görüşmeden sonra bir dakikalık öz değerlendirme için kullanılabilir.", "src": "Kaplan & Sadock; NICE CG136"}, {"sec": "DEĞERLENDİRME", "title": "Beş temel mesaj", "points": ["İlişki klinik işlemin ön koşulu değil, bir parçasıdır", "Empati yanlış inancı onaylamak değildir", "İttifak kopması fark edilip onarılabilir", "Profesyonel sınırlar terapötik güveni korur", "Güvenlik, özerklik, kanıt ve etik birlikte düşünülür"], "notes": "Bitirirken katılımcılara klinikte ertesi gün kullanacakları tek bir cümleyi seçmelerini isteyin: “Bu görüşmeden ne bekliyorsunuz?” veya “Bunu doğru anladım mı?”", "src": "Kaplan & Sadock; NICE CG136"}, {"sec": "KAYNAKLAR", "title": "Temel kaynaklar I", "points": ["NICE CG136. Service user experience in adult mental health (2011)", "NICE NG197. Shared decision making (2021)", "NICE NG10. Violence and aggression (2015; güncel çevrimiçi sürüm)", "NICE NG225. Self-harm: assessment, management and preventing recurrence (2022)"], "notes": "NICE önerileri Birleşik Krallık bağlamında geliştirilmiştir. Türkiye’de uygulama için ulusal mevzuat ve kurumsal protokoller esas alınır.", "src": "https://www.nice.org.uk/guidance/cg136 | https://www.nice.org.uk/guidance/ng197 | https://www.nice.org.uk/guidance/ng10"}, {"sec": "KAYNAKLAR", "title": "Temel kaynaklar II", "points": ["Bordin ES. The generalizability of the psychoanalytic concept of the working alliance. 1979", "Flückiger C et al. The alliance in adult psychotherapy: a meta-analytic synthesis. 2018", "Gabbard GO. Psychodynamic Psychiatry in Clinical Practice", "Kaplan & Sadock’s Synopsis of Psychiatry; SAMHSA Trauma-Informed Care"], "notes": "Sunumun araştırma kanıtı ile klinik öğretim önerilerini ayırın. Dinamik kavramlar açıklayıcı klinik modellerdir; tüm fenomenlerin kesin nedensel açıklaması olarak sunulmamalıdır.", "src": "Bordin 1979; Flückiger et al. 2018; Gabbard; Kaplan & Sadock"}];let index=0;const deck=document.getElementById('deck');function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}function rich(s){return esc(s).replace(/\*\*(.*?)\*\*/g,'<b>$1</b>')}deck.innerHTML=SLIDES.map((s,i)=>`<section class="slide" id="s${i}"><header class="top"><span class="tag">${esc(s.sec)}</span><small>PSİKİYATRİ ASİSTAN EĞİTİMİ</small></header><div class="main"><h1>${esc(s.title)}</h1><ul class="points">${s.points.map(x=>`<li>${rich(x)}</li>`).join('')}</ul></div><footer class="footer"><span class="source">Kaynak: ${esc(s.src)}</span><span class="count">${i+1} / ${SLIDES.length}</span></footer></section>`).join('');document.getElementById('tocitems').innerHTML=SLIDES.map((s,i)=>`<button data-slide="${i}">${i+1}. ${esc(s.title)}</button>`).join('');function show(n){index=Math.min(SLIDES.length-1,Math.max(0,n));document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('on',i===index));location.hash='slayt-'+(index+1)}show(Math.max(0,(parseInt(location.hash.replace(/\D/g,''))||1)-1));function toggleList(){document.getElementById('toc').classList.toggle('show')}document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('next').onclick=()=>show(index+1);document.getElementById('index').onclick=toggleList;document.getElementById('close').onclick=toggleList;document.getElementById('full').onclick=()=>{if(!document.fullscreenElement)document.documentElement.requestFullscreen?.();else document.exitFullscreen?.()};document.querySelectorAll('[data-slide]').forEach(b=>b.onclick=()=>{show(Number(b.dataset.slide));toggleList()});document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(index+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}if(e.key.toLowerCase()==='l')toggleList();if(e.key.toLowerCase()==='f')document.getElementById('full').click();if(e.key==='Escape')document.getElementById('toc').classList.remove('show')});let startX;document.addEventListener('touchstart',e=>startX=e.touches[0].clientX,{passive:true});document.addEventListener('touchend',e=>{if(startX===undefined)return;const d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>60)show(index+(d<0?1:-1));startX=undefined},{passive:true});</script></body></html>
